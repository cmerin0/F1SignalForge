services:
  api:
    # Build a statically linked binary for the F1SignalForge API.
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: f1signalforge-api:local
    container_name: f1signalforge-api

    # Environment variables are passed to the container at runtime.
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"

    # Expose the API port to the host machine so it can be accessed from outside the container.
    ports:
      - "8080:8080"

    # Wait for the PostgreSQL service to be healthy before starting the API service.
    depends_on:
      postgres:
        condition: service_healthy
        restart: true

  simulator:
    # Build a statically linked binary for the F1SignalForge simulator.
    build:
      context: .
      dockerfile: Dockerfile
      target: simulator
    image: f1signalforge-simulator:local
    container_name: f1signalforge-simulator

    # commands to run the simulator binary in a separate container if needed.
    command: 
      - "-api-url=http://api:8080"
      - "-car-number=44"
      - "-interval=1s"

    # Wait for the api service to be healthy before starting the simulator service.
    depends_on:
      api:
        condition: service_started

    restart: unless-stopped

  postgres:
    # Pin a major version so every developer uses a compatible database engine.
    image: postgres:18-alpine

    # A predictable local name makes diagnostics easier.
    container_name: f1signalforge-pg

    environment:
      # Values come from .env, which is intentionally not committed.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      # PostgreSQL 18 stores data in a major-version-specific subdirectory.
      # Mount the parent directory so the image can manage that layout.
      - postgres_data:/var/lib/postgresql

    healthcheck:
      # A running container is not necessarily a ready database.
      # $$ escapes the variable for Compose so PostgreSQL receives it.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data: